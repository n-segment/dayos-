<!-- ── Splash Overlay ── -->
<div id="dayos-splash" style="
  position:fixed;inset:0;z-index:99999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:52px;
  overflow:hidden;
  background:linear-gradient(152deg,#5b7cc0 0%,#5b7cc0 22%,#ee7358 58%,#f8dc8f 100%);
  font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  transition:opacity 0.7s ease;
">
  <!-- Animated blobs -->
  <div class="sp-blob" style="left:14%;top:12%;width:92%;height:96%;background:radial-gradient(closest-side,#5b7cc0,#5b7cc000 72%);animation:spBlob1 6s ease-in-out infinite;"></div>
  <div class="sp-blob" style="left:86%;top:20%;width:82%;height:86%;background:radial-gradient(closest-side,#5b7cc0,#5b7cc000 72%);opacity:.85;animation:spBlob2 6s ease-in-out infinite;"></div>
  <div class="sp-blob" style="left:58%;top:56%;width:90%;height:82%;background:radial-gradient(closest-side,#ee7358,#ee735800 72%);opacity:.82;animation:spBlob3 6s ease-in-out infinite;"></div>
  <div class="sp-blob" style="left:22%;top:88%;width:88%;height:74%;background:radial-gradient(closest-side,#f8dc8f,#f8dc8f00 72%);opacity:.9;animation:spBlob4 6s ease-in-out infinite;"></div>
  <div class="sp-blob" style="left:40%;top:34%;width:46%;height:44%;background:radial-gradient(closest-side,#fff,#fff0 72%);opacity:.3;animation:spBlob5 6s ease-in-out infinite;"></div>
  <!-- Grain -->
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.055) 0 1px,rgba(0,0,0,.045) 1px 2px),repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 1px,rgba(0,0,0,.035) 1px 2px);opacity:.55;mix-blend-mode:soft-light;pointer-events:none;"></div>
  <!-- Glass overlay -->
  <div style="position:absolute;inset:0;background:rgba(255,255,255,.10);backdrop-filter:blur(22px) saturate(112%);-webkit-backdrop-filter:blur(22px) saturate(112%);pointer-events:none;"></div>

  <!-- Wordmark -->
  <div class="sp-wordmark" style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;">
    <div style="font-size:clamp(52px,8vw,88px);font-weight:600;letter-spacing:-.035em;color:#fff;line-height:1;text-shadow:0 3px 34px rgba(80,50,90,.24);animation:spRise .9s .3s cubic-bezier(.22,1,.36,1) both;">Day OS</div>
    <div style="font-size:clamp(14px,2vw,22px);font-weight:400;color:rgba(255,255,255,.82);text-shadow:0 2px 20px rgba(80,50,90,.22);animation:spFade .8s .8s ease both;">계획하고, 기록하고, 돌아보는 나만의 하루</div>
  </div>

</div>

<style>
.sp-blob{position:absolute;transform:translate(-50%,-50%);filter:blur(6px);pointer-events:none;}
@keyframes spBlob1{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(calc(-50% + 8px),calc(-50% + 6px)) scale(1.1)}}
@keyframes spBlob2{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(calc(-50% - 6px),calc(-50% - 5px)) scale(.95)}}
@keyframes spBlob3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(calc(-50% + 5px),calc(-50% + 4px)) scale(1.08)}}
@keyframes spBlob4{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(calc(-50% - 7px),calc(-50% + 3px)) scale(.97)}}
@keyframes spBlob5{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(calc(-50% + 4px),calc(-50% - 6px)) scale(1.05)}}
@keyframes spRise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes spFade{from{opacity:0}to{opacity:1}}
@keyframes spColIn{from{opacity:0;transform:scaleY(.86)}to{opacity:1;transform:scaleY(1)}}
</style>

<script>
(function(){
  const h = new Date().getHours();
  const isNight = h >= 18 || h < 6;
  const splash = document.getElementById('dayos-splash');
  if (isNight) {
    const nightGrad = 'linear-gradient(152deg,#3a4fa8 0%,#4a52b8 30%,#6b5cc0 58%,#b05888 85%,#d07878 100%)';
    splash.style.background = nightGrad;
    const blobs = splash.querySelectorAll('.sp-blob');
    const nightBlobs = ['radial-gradient(closest-side,#4a5fc8,#4a5fc800 72%)','radial-gradient(closest-side,#6b5cc0,#6b5cc000 72%)','radial-gradient(closest-side,#b05888,#b0588800 72%)','radial-gradient(closest-side,#9060c8,#9060c800 72%)','radial-gradient(closest-side,#d070a0,#d070a000 72%)'];
    blobs.forEach((b,i)=>{ if(nightBlobs[i]) b.style.background = nightBlobs[i]; });
  }
  setTimeout(()=>{
    splash.style.opacity='0';
    setTimeout(()=>{ splash.style.display='none'; }, 700);
  }, 2800);
})();
</script>

  <div class="mfp-screen">
    <iframe id="mfpFrame" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen></iframe>
  </div>
  <button class="mfp-close" id="mfpClose">×</button>
</div>

<!-- 낙서 캔버스 (전체화면 오버레이) -->
<canvas class="doodle-canvas hidden" id="doodleCanvas"></canvas>
<div class="doodle-toolbar hidden" id="doodleToolbar">
  <button class="doodle-tool-color active" data-color="#ffffff" style="background:#ffffff" title="흰색"></button>
  <button class="doodle-tool-color" data-color="#ffd966" style="background:#ffd966" title="노랑"></button>
  <button class="doodle-tool-color" data-color="#f28b82" style="background:#f28b82" title="핑크"></button>
  <button class="doodle-tool-color" data-color="#81c995" style="background:#81c995" title="초록"></button>
  <button class="doodle-tool-color" data-color="#78d9ec" style="background:#78d9ec" title="하늘"></button>
  <div class="doodle-sep"></div>
  <button class="doodle-tool-size active" data-size="3" title="가는 선"><span class="doodle-size-dot" style="width:3px;height:3px"></span></button>
  <button class="doodle-tool-size" data-size="8" title="보통 선"><span class="doodle-size-dot" style="width:8px;height:8px"></span></button>
  <button class="doodle-tool-size" data-size="18" title="굵은 선"><span class="doodle-size-dot" style="width:14px;height:14px"></span></button>
  <div class="doodle-sep"></div>
  <button class="doodle-tool-icon" id="doodleEraserBtn" title="지우개">

  <button class="doodle-tool-icon" id="doodleClearBtn" title="전체 지우기">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3L11 11M11 3L3 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>
  <button class="doodle-done-btn" id="doodleDoneBtn" title="낙서 완료">완료</button>
</div>

</div>

<div class="onboarding-overlay hidden" id="onboardingOverlay" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
  <section class="onboarding-card">
    <p class="onboarding-kicker">처음 시작하기</p>
    <h2 class="onboarding-title" id="onboardingTitle">DayOS에 오신 걸 환영해요</h2>
    <div class="onboarding-list">
      <article class="onboarding-item">
        <span class="onboarding-dot"></span>
        <div>
          <h3>화면 꾸미기</h3>
          <p>좋아하는 이미지나 영상, 낙서와 메모를 홈 화면에 올려두고 원하는 대로 화면을 꾸며보세요.</p>
        </div>
      </article>
      <article class="onboarding-item">
        <span class="onboarding-dot onboarding-dot--blue"></span>

        </div>
      </article>
    </div>
    <button class="onboarding-close" id="onboardingCloseBtn" type="button">좋아요</button>
  </section>
</div>
